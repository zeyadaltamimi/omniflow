<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#07090f">
  <title>OmniFlow Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.344.0/dist/umd/lucide.min.js"></script>
  <style>
    :root { --bg: #07090f; --panel: #0e121b; --line: #1d2433; --muted: #8b95a8; --text: #eef1f6; --gold: #e8c47c; }
    html, body { font-family: 'IBM Plex Sans Arabic', -apple-system, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
    body { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
    input, textarea, select { font-size: 16px !important; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; direction: ltr; text-align: left; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; }
    .field { width: 100%; background: #0a0d14; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; color: var(--text); }
    .field:focus { outline: none; border-color: var(--gold); }
    .field::placeholder { color: #5b6476; }
    .tap { min-height: 44px; }
    .prompt { background: #06080d; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 12.5px; line-height: 1.7; white-space: pre-wrap; color: #dfe4ec; }
    .gold-btn { background: linear-gradient(135deg, #f1d595, #c9a35a); color: #1a1406; }
    .gold-btn:hover { filter: brightness(1.05); }
    .chip { border: 1px solid var(--line); background: #0a0d14; color: #c9d0dc; }
    .chip.on { border-color: var(--gold); color: var(--gold); background: rgba(232,196,124,.08); }
    .mode { color: var(--muted); }
    .mode.on { background: #171d2a; color: var(--text); }
    details > summary::-webkit-details-marker { display: none; }
    button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin 1s linear infinite; }
    @keyframes shimmer { 0% { background-position: -400px 0; } 100% { background-position: 400px 0; } }
    .skeleton { background: linear-gradient(90deg, #0e121b 0px, #171d2a 200px, #0e121b 400px); background-size: 800px 100%; animation: shimmer 1.4s infinite linear; border-radius: 12px; }
  </style>
</head>
<body class="min-h-screen antialiased">

  <div id="toast" role="status" aria-live="polite" class="fixed z-[80] inset-x-4 transition-all duration-300 opacity-0 pointer-events-none translate-y-4 max-w-md mx-auto flex items-center gap-3 px-4 py-3 rounded-2xl bg-[#121722] border border-[#2a3242] shadow-2xl" style="bottom: calc(92px + env(safe-area-inset-bottom));">
    <span id="toast-icon" class="text-lg">✓</span>
    <div class="min-w-0"><p id="toast-title" class="text-sm font-semibold"></p><p id="toast-desc" class="text-xs text-[color:var(--muted)]"></p></div>
  </div>

  <header class="sticky top-0 z-40 bg-[#07090f]/85 backdrop-blur border-b border-[color:var(--line)]">
    <div class="max-w-xl mx-auto px-4 h-14 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg gold-btn flex items-center justify-center"><i data-lucide="clapperboard" class="w-4 h-4"></i></div>
        <div class="leading-tight"><p class="text-[15px] font-bold">OmniFlow Studio</p><p class="text-[11px] text-[color:var(--muted)]">إعلان كامل من صورة منتج</p></div>
      </div>
      <div class="flex items-center gap-1">
        <button id="btn-history" type="button" aria-label="السجل" class="tap w-11 rounded-xl hover:bg-white/5 flex items-center justify-center"><i data-lucide="history" class="w-5 h-5 text-[color:var(--muted)]"></i></button>
        <button id="btn-settings" type="button" aria-label="الإعدادات" class="tap w-11 rounded-xl hover:bg-white/5 flex items-center justify-center"><i data-lucide="settings-2" class="w-5 h-5 text-[color:var(--muted)]"></i></button>
      </div>
    </div>
  </header>

  <main class="max-w-xl mx-auto px-4 pt-5 space-y-5">

    <!-- Input -->
    <section class="space-y-4">
      <div class="flex p-1 rounded-2xl bg-[#0a0d14] border border-[color:var(--line)]" role="tablist">
        <button type="button" data-mode="product" role="tab" class="mode tap flex-1 rounded-xl text-sm font-semibold">🛍️ إعلان منتج</button>
        <button type="button" data-mode="free" role="tab" class="mode tap flex-1 rounded-xl text-sm font-semibold">🎬 مشهد حر</button>
      </div>
      <div id="drop" class="panel overflow-hidden"></div>
      <input id="file" type="file" accept="image/*" class="hidden">

      <div id="name-wrap" class="space-y-1.5">
        <label for="name" class="text-sm font-semibold">اسم المنتج</label>
        <input id="name" class="field tap" placeholder="مثال: شامبو ضد القشرة، عطر عود، قهوة مختصة، فيلا في الملقا" autocomplete="off">
      </div>
      <div class="space-y-1.5">
        <label for="idea" class="text-sm font-semibold"><span id="idea-label">فكرتك</span> <span id="idea-sub" class="text-xs font-normal text-[color:var(--muted)]">اختياري، اتركها ويبتكر لك</span></label>
        <textarea id="idea" rows="2" class="field leading-relaxed" placeholder="مثال: أبيه فخم وفيه مجلس، أو: المساحة 450م² وتظهر على العقار"></textarea>
      </div>

      <div class="flex items-center gap-2 flex-wrap" id="quick-settings"></div>

      <button id="btn-make" type="button" class="tap w-full rounded-2xl gold-btn font-bold text-base flex items-center justify-center gap-2 py-3.5 disabled:opacity-60">
        <i id="make-icon" data-lucide="sparkles" class="w-5 h-5"></i><span id="make-label">اصنع الإعلان</span>
      </button>
      <p id="key-hint" class="hidden text-xs text-center text-[color:var(--muted)]">تحتاج مفتاح Gemini · <button type="button" data-open="settings" class="text-[color:var(--gold)] underline">أضفه من الإعدادات</button></p>
    </section>

    <!-- Result -->
    <section id="result" class="space-y-4 pb-4"></section>
  </main>

  <!-- Bottom bar -->
  <div id="bar" class="hidden fixed bottom-0 inset-x-0 z-40 bg-[#07090f]/95 backdrop-blur border-t border-[color:var(--line)]" style="padding-bottom: env(safe-area-inset-bottom);">
    <div class="max-w-xl mx-auto px-4 py-3 flex gap-2">
      <button id="btn-revise-jump" type="button" class="tap px-4 rounded-2xl chip text-sm font-semibold flex items-center gap-1.5"><i data-lucide="pencil" class="w-4 h-4"></i>عدّل</button>
      <button id="btn-copy-all" type="button" class="tap flex-1 rounded-2xl bg-white text-black font-bold flex items-center justify-center gap-2"><i data-lucide="copy" class="w-4 h-4"></i><span id="copy-all-label">نسخ الإعلان كاملاً</span></button>
    </div>
  </div>

  <!-- Settings -->
  <div id="settings" class="hidden fixed inset-0 z-50 flex items-end sm:items-center justify-center">
    <div data-close="settings" class="absolute inset-0 bg-black/70"></div>
    <div class="relative w-full sm:max-w-md panel rounded-b-none sm:rounded-[18px] p-5 space-y-5 max-h-[90vh] overflow-y-auto" style="padding-bottom: calc(20px + env(safe-area-inset-bottom));">
      <div class="flex items-center justify-between"><h2 class="font-bold">الإعدادات</h2><button data-close="settings" type="button" aria-label="إغلاق" class="tap w-11 rounded-xl hover:bg-white/5 flex items-center justify-center"><i data-lucide="x" class="w-5 h-5"></i></button></div>
      <div class="space-y-1.5">
        <label for="s-key" class="text-sm font-semibold">مفتاح Gemini</label>
        <input id="s-key" type="password" class="field tap mono" placeholder="AIza..." autocomplete="off">
        <p class="text-xs text-[color:var(--muted)]">يُحفظ تلقائياً في متصفحك فقط.</p>
      </div>
      <div class="space-y-1.5">
        <label for="s-model" class="text-sm font-semibold">النموذج</label>
        <div class="flex gap-2"><select id="s-model" class="field tap mono flex-1"></select>
          <button id="s-refresh" type="button" class="tap px-3 rounded-xl chip text-xs font-semibold shrink-0">تحديث</button></div>
        <p id="s-model-note" class="text-xs text-[color:var(--muted)] leading-relaxed"></p>
      </div>
      <div id="settings-opts" class="space-y-4"></div>
      <button data-close="settings" type="button" class="tap w-full rounded-2xl gold-btn font-bold">تم</button>
    </div>
  </div>

  <!-- History -->
  <div id="history" class="hidden fixed inset-0 z-50">
    <div data-close="history" class="absolute inset-0 bg-black/70"></div>
    <aside class="absolute inset-y-0 left-0 w-full sm:w-[380px] bg-[color:var(--panel)] border-r border-[color:var(--line)] flex flex-col">
      <div class="p-4 flex items-center justify-between border-b border-[color:var(--line)]"><h2 class="font-bold">السجل</h2><button data-close="history" type="button" aria-label="إغلاق" class="tap w-11 rounded-xl hover:bg-white/5 flex items-center justify-center"><i data-lucide="x" class="w-5 h-5"></i></button></div>
      <div id="history-list" class="flex-1 overflow-y-auto p-4 space-y-2"></div>
    </aside>
  </div>

<script>
/* =========================================================
   OmniFlow Studio v7 — one photo + name → one strong, researched ad for Google Flow
   Brain: the "flow-product-ad-prompter" skill, run by Gemini (with Google Search)
   ========================================================= */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
};
const icons = () => { try { window.lucide && lucide.createIcons(); } catch (e) {} };
const words = (s) => (String(s || '').trim().match(/\S+/g) || []).length;

const OPTS = {
  aspect: { label: 'الأبعاد', values: { '9:16': 'رأسي 9:16', '16:9': 'عريض 16:9', '1:1': 'مربع 1:1' }, def: '9:16' },
  scenes: { label: 'عدد المشاهد', values: { '3': '3 مشاهد', '4': '4 مشاهد' }, def: '3' },
  secs: { label: 'مدة المشهد', values: { '6': '6 ث', '8': '8 ث', '10': '10 ث' }, def: '8' },
  rhythm: { label: 'إيقاع المقطع', values: { oner: 'مشهد متصل مصمم', cuts: 'قطعات متناغمة' }, def: 'oner' },
  creativity: { label: 'جرعة الإبداع', values: { real: 'واقعي', bold: 'مبتكر', wild: 'جريء وخيالي' }, def: 'bold' },
  people: { label: 'الأشخاص', values: { faces: 'يظهر الوجه', nofaces: 'بدون وجوه', none: 'بدون أشخاص' }, def: 'faces' },
  audio: { label: 'الصوت', values: { music: 'مؤثرات + موسيقى', sfx: 'مؤثرات فقط' }, def: 'music' }
};
const state = { img: null, opts: {}, result: null, busy: false, sources: [], mode: 'product', brain: '' };

/* Models: preferred order (quality/price). The list from the API replaces this when available. */
const MODEL_PREF = ['gemini-3.8-flash', 'gemini-3.6-flash', 'gemini-3.5-flash-lite', 'gemini-3.1-flash-lite', 'gemini-3-flash-preview', 'gemini-2.5-flash-lite'];
const MODEL_NOTE = {
  'gemini-3.8-flash': 'الأفضل للإبداع · تقريباً 5 هللات للإعلان',
  'gemini-3.6-flash': 'قريب من 3.8 بنفس السعر',
  'gemini-3.5-flash-lite': 'اقتصادي جيد · تقريباً 2 هللة للإعلان',
  'gemini-3.1-flash-lite': 'الأرخص من الجيل الجديد · تقريباً 2 هللة',
  'gemini-3-flash-preview': 'جيد · تقريباً 4 هللات',
  'gemini-2.5-flash-lite': 'الأرخص وقد لا يتوفر للحسابات الجديدة'
};
function currentModel() { const m = store.get('of_model', ''); return (!m || /^gemini-2\.5-flash$|^gemini-2\.5-pro$/.test(m)) ? MODEL_PREF[0] : m; }
async function listModels() {
  const key = store.get('of_key', '');
  if (!key) return [];
  const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200', { headers: { 'x-goog-api-key': key } });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error((data.error && data.error.message) || ('HTTP ' + res.status));
  return (data.models || []).filter((m) => (m.supportedGenerationMethods || []).includes('generateContent'))
    .map((m) => m.name.replace(/^models\//, '')).filter((n) => /^gemini-\d/.test(n) && !/image|tts|audio|live|embedding|thinking-exp|robotics|computer/.test(n));
}
async function refreshModels(silent) {
  try {
    const list = await listModels();
    if (!list.length) return;
    store.set('of_models', list);
    const cur = currentModel();
    if (!list.includes(cur)) { const pick = MODEL_PREF.find((m) => list.includes(m)) || list[0]; store.set('of_model', pick); }
    renderModels();
    if (!silent) toast('تم تحديث قائمة النماذج', `${list.length} نموذج متاح لمفتاحك`);
  } catch (e) { if (!silent) toast('تعذّر جلب النماذج', String(e.message || e).slice(0, 120), true); }
}
function renderModels() {
  const avail = store.get('of_models', []);
  const list = avail.length ? MODEL_PREF.filter((m) => avail.includes(m)).concat(avail.filter((m) => !MODEL_PREF.includes(m))) : MODEL_PREF;
  const cur = currentModel();
  $('s-model').innerHTML = list.map((m) => `<option value="${m}" ${m === cur ? 'selected' : ''}>${m}${MODEL_NOTE[m] ? ' — ' + MODEL_NOTE[m].split(' · ')[0] : ''}</option>`).join('') + (list.includes(cur) ? '' : `<option value="${cur}" selected>${cur}</option>`);
  $('s-model-note').textContent = (MODEL_NOTE[cur] || 'نموذج متاح لمفتاحك') + '. التكلفة لكل إعلان بالهللات، وفيه حصة مجانية يومية.';
}
async function loadBrain() {
  try { const r = await fetch('./brain.md', { cache: 'no-cache' }); if (r.ok) state.brain = (await r.text()).split('\n').filter((l) => !/^\s*#/.test(l)).join('\n').trim().slice(0, 12000); } catch (e) {}
}
Object.keys(OPTS).forEach((k) => { state.opts[k] = OPTS[k].def; });

/* ---------------- The brain: skill + creative direction ---------------- */
function systemPrompt() {
  const o = state.opts;
  const level = { real: 'grounded and realistic, premium but believable', bold: 'inventive and surprising, with one bold visual idea that is still believable', wild: 'daring, imaginative and surreal: scale shifts, transformations, impossible-but-beautiful worlds built from the product itself' }[o.creativity];
  const free = state.mode === 'free';
  return `${free ? `FREE SCENE MODE: there is no product. Turn the user's Arabic scene idea into a cinematic short of ${o.scenes} scenes (or fewer if the idea is a single moment). Skip the product read (put a one-line Arabic summary of the idea in product_read_ar), skip compliance, keep everything else. Respect every constraint the user states (e.g. "no face", camera from behind).

` : ''}You are an award-winning commercial director and AI-video prompt engineer. From a product photo (and/or name) and an optional Arabic idea, you create ONE strong, original, scroll-stopping product ad for Google Flow, delivered as ready-to-paste English prompts. Flow workflow per scene: first an IMAGE prompt (Nano Banana, product photo attached) creates the first frame, then a VIDEO prompt (Gemini Omni, Frames to Video) animates that frame.

1) READ THE PRODUCT (from the photo): name, brand, size, type; exact visual identity (shape, material, liquid color, cap, label colors, graphic motifs); claims and ingredients actually printed and legible. Never invent ingredients or claims; mark cut-off text as unclear.

2) RESEARCH: use Google Search to see how successful brands and stores advertise this kind of product (Saudi/Gulf first, then the best global work, current TikTok/Instagram/Snapchat trends). Steal the logic, never copy.

3) CREATIVE ENGINE — before writing, silently brainstorm at least 6 very different concepts through these lenses: sensory macro world of the product's real texture/ingredient; transformation or morph (raw ingredient → product, problem → relief); scale shift or miniature world; a Saudi/Gulf cultural ritual or moment; a story with a twist or reveal; satisfying ASMR physics; the product's point of view; an elemental metaphor (water, fire, smoke, sand, light) taken from what the product is or does; a match-cut that links the scenes. Score each on: scroll-stopping hook, fit with this exact product and its benefit, how well AI video can render it, memorability. Keep the single best one. Creativity level: ${level}.

THE IDEA — one concept, not options. It must be specific to THIS product, not a generic template:
- A hook in the first 2 seconds that stops the scroll (a surprising image, a striking contrast, a satisfying physical moment).
- One memorable visual metaphor or signature moment built from the product's real benefit, ingredient, texture, smell or use.
- A clear arc across ${o.scenes} scenes (e.g. problem → product hero → result & packshot, or tease → ritual → payoff), ending on the product.
- The product is used the way it is really used (perfume sprayed, food eaten, jewelry worn with the camera gliding over it, shampoo lathered, property revealed by drone…).
- Avoid clichés (no random sparkles, no floating product in a void unless it means something).
- If the user gives an idea, build on it and make it better.

4) EACH SCENE (${o.secs} seconds) gets:
A. image_prompt — the frozen first frame that matches the OPENING beat of the video, 70–120 words, in this order: Shot (lens, angle, framing for ${o.aspect}) → Subject (for product scenes: "the exact product from the attached reference image, same shape, label, colors and proportions") → Environment → Lighting (matching the pack's brand colors) → Style (photorealistic premium commercial photography). No motion verbs.
B. video_prompt — 100–150 words. Each clip is a choreographed mini-film, NOT one static move. It must feel like a real high-end commercial: surprising, rhythmic, precise and smooth.
${o.rhythm === 'oner'
    ? `- Begin "Start from the provided image as the first frame. One continuous choreographed shot, no cuts."
- Write 3–4 beats that flow into each other inside the ${o.secs} seconds, using natural timing ("It opens on…", "as…", "then…", "in the final second…"). The camera follows ONE continuous, motivated path that evolves (e.g. macro push-in that becomes an orbit, then a rising crane reveal), never a random drift.
- Build transitions inside the shot: a match-move, a whip-through, a focus pull, a light sweep, a reveal from behind a foreground element, or a transformation (drop → mist → ingredients, smoke → setting, beans → dune).`
    : `- Begin "Start from the provided image as the first frame." then describe a fast, editorial sequence of 3–4 shots inside the ${o.secs} seconds, each joined by a deliberate transition (match cut on shape or motion, whip transition, light-flash cut, morph). Name each shot's framing (macro, close-up, wide, top-down) and keep the product identical across cuts.`}
- Use speed ramps (slow motion into real time) and interactive physics where the world reacts to the product (liquid forms a crown, fabric unfurls, smoke wraps the product, light ripples across the surface).
- End on a precise hero frame of the product, perfectly composed and still for the last half-second.
- Audio line synchronized to the action: specific sound hits on each beat (whoosh, chime, crack, sizzle, splash) ${o.audio === 'music' ? 'over a short cinematic music bed that builds and lands on the final frame' : 'and ambience, no music'}; no spoken dialogue.
- For product scenes add "Keep the product and label exactly as in the first frame; it stays sharp and fully visible."
Example of the quality and rhythm expected (do not copy the content): "Start from the provided image as the first frame. One continuous choreographed shot, no cuts. It opens in extreme macro on a single drop sliding down the glass of the perfume bottle; the camera pulls back and arcs around it as the drop falls in slow motion and bursts into a ring of golden mist. As the mist expands it reveals a dark marble majlis forming around the bottle, oud smoke curling upward in warm side light. The camera rises in one smooth crane move while the bottle stays centered and sharp, ramping from slow motion to real time as the cap catches a flash of light, and settles into a perfect hero frame in the final second. Audio: a deep whoosh as the drop falls, a crystalline chime on the burst, soft oud crackle, a rising cinematic pulse that lands on the final frame. Keep the bottle, cap and label exactly as in the first frame; it stays sharp and fully visible. No text, no captions, no subtitles, no watermark."
Both prompts end with: "No text, no captions, no subtitles, no watermark." Never ask the model to render text, logos or brand names.

People: ${o.people === 'none' ? 'no people at all, product only' : o.people === 'nofaces' ? 'people allowed but no faces: hands, shoulders, back-of-head, silhouettes' : 'people allowed with faces'}; modest, Saudi-appropriate styling, Saudi/Gulf settings when relevant.
Real estate: the uploaded photo is the exact property; drone, orbit and top-down reveals; never add or change buildings; areas and prices go to on-screen text.
Health, pharmacy and cosmetic products: no cure or guarantee language ("cures", "100%", "permanently"); no medical before/after; name ingredients only if printed on the pack.

5) Also write an Arabic voice-over (Saudi/Gulf-friendly, fits ${Number(o.scenes) * Number(o.secs)} seconds, compliant) and short Arabic on-screen text lines for the editor.

${state.brain ? `House rules from the user's brain file (follow them):\n${state.brain}\n\n` : ''}Reply with ONLY one JSON object, no markdown:
{"product_read_ar": string (3–5 short Arabic lines: name/type, visual identity, printed claims/ingredients, unclear items),
 "research_ar": [2–4 short Arabic insights from similar ads],
 "idea": {"title_ar": string, "logline_ar": string (one sentence), "why_ar": string (why it fits this product)},
 "scenes": [{"title_ar": string, "beat_ar": string (one Arabic line describing the scene), "attach_ar": string (what to attach in Flow), "image_prompt": string, "video_prompt": string}],
 "voiceover_ar": string,
 "onscreen_ar": [string],
 "notes_ar": [string (compliance or production tips, optional)]}`;
}

function userParts(extra) {
  const parts = [];
  if (state.img) parts.push({ inlineData: { mimeType: 'image/jpeg', data: state.img.full.split(',')[1] } });
  parts.push({ text: [
    state.mode === 'free' ? 'Mode: free scene (no product).' : `Product name (Arabic): ${$('name').value.trim() || '(read it from the photo)'}`,
    `User idea (Arabic): ${$('idea').value.trim() || 'none — invent the best idea'}`,
    `Reference photo attached: ${state.img ? (state.mode === 'free' ? 'yes (use it as the visual reference for the scene)' : 'yes') : 'no'}`,
    `Aspect ratio: ${state.opts.aspect}. Scenes: ${state.opts.scenes} × ${state.opts.secs}s.`,
    extra || ''
  ].filter(Boolean).join('\n') });
  return parts;
}

async function callGemini(parts, search, tried) {
  tried = tried || [];
  const key = store.get('of_key', '');
  const model = currentModel();
  const temp = { real: 0.7, bold: 1.0, wild: 1.25 }[state.opts.creativity] || 1.0;
  const body = { systemInstruction: { parts: [{ text: systemPrompt() }] }, contents: [{ role: 'user', parts }], generationConfig: { temperature: temp } };
  if (search) body.tools = [{ google_search: {} }];
  else body.generationConfig.responseMimeType = 'application/json';
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 120000);
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
    method: 'POST', signal: ctrl.signal, headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key }, body: JSON.stringify(body)
  });
  clearTimeout(timer);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const msg = (data.error && data.error.message) || ('HTTP ' + res.status);
    if (/no longer available|not found|is not supported|deprecated|not available/i.test(msg) && tried.length < 3) {
      let avail = store.get('of_models', []);
      if (!avail.length) { try { avail = await listModels(); store.set('of_models', avail); } catch (e) {} }
      const next = MODEL_PREF.concat(avail).find((m) => m !== model && !tried.includes(m) && (!avail.length || avail.includes(m)));
      if (next) { store.set('of_model', next); renderModels(); toast('تم التحويل لنموذج متاح', next); return callGemini(parts, search, tried.concat(model)); }
    }
    throw new Error(msg);
  }
  const cand = (data.candidates || [])[0] || {};
  const text = ((cand.content && cand.content.parts) || []).map((p) => p.text || '').join('');
  const t = text.replace(/```json|```/g, '');
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a < 0 || b <= a) throw new Error('رد غير مكتمل من Gemini، جرّب مرة ثانية');
  const json = JSON.parse(t.slice(a, b + 1));
  const seen = new Set();
  const sources = ((cand.groundingMetadata && cand.groundingMetadata.groundingChunks) || []).map((c) => c.web).filter((w) => w && w.uri && !seen.has(w.uri) && seen.add(w.uri)).map((w) => ({ title: w.title || w.uri, url: w.uri })).slice(0, 6);
  return { json, sources };
}

async function generate(extra) {
  let out;
  try { out = await callGemini(userParts(extra), true); }
  catch (e) {
    if (/abort/i.test(String(e))) throw new Error('انتهت المهلة، جرّب مرة ثانية');
    out = await callGemini(userParts(extra), false);
  }
  const j = out.json;
  if (!j.scenes || !j.scenes.length) throw new Error('ما رجعت مشاهد، جرّب مرة ثانية');
  return { ...j, sources: out.sources, mode: state.mode, name: state.mode === 'free' ? 'مشهد حر' : $('name').value.trim(), idea_in: $('idea').value.trim(), opts: { ...state.opts }, time: Date.now() };
}

/* ---------------- Actions ---------------- */
async function make() {
  if (state.busy) return;
  if (!store.get('of_key', '')) { $('settings').classList.remove('hidden'); toast('أضف مفتاح Gemini أولاً', '', true); return; }
  if (state.mode === 'product' && !state.img && !$('name').value.trim()) { toast('أضف صورة المنتج أو اسمه', '', true); return; }
  if (state.mode === 'free' && !$('idea').value.trim()) { toast('اكتب فكرة المشهد', '', true); $('idea').focus(); return; }
  setBusy(true, 'يقرأ المنتج ويبحث ويبتكر الفكرة…');
  renderSkeleton();
  try {
    state.result = await generate();
    saveHistory();
    renderResult();
    $('result').scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (e) {
    toast('تعذّر الصنع', String(e.message || e).slice(0, 140), true);
    renderResult();
  }
  setBusy(false);
}

async function revise(instruction) {
  if (state.busy || !state.result || !instruction.trim()) return;
  setBusy(true, 'يعدّل الإعلان…');
  const prev = { ...state.result }; delete prev.sources;
  try {
    const r = await generate(`Here is the current ad (JSON):\n${JSON.stringify(prev)}\n\nUser change request (Arabic): ${instruction}\nApply the change, keep everything else that still works, keep the same JSON format.`);
    if (!r.sources.length) r.sources = state.result.sources || [];
    state.result = r;
    saveHistory();
    renderResult();
    toast('تم التعديل', '');
  } catch (e) { toast('تعذّر التعديل', String(e.message || e).slice(0, 140), true); }
  setBusy(false);
}

        ${(r.sources || []).length ? `<div class="space-y-1">${r.sources.map((s) => `<a href="${esc(s.url)}" target="_blank" rel="noopener" class="block text-xs text-[color:var(--gold)] underline truncate">${esc(s.title)}</a>`).join('')}</div>` : ''}

      </div>

        <div class="prompt mono">${esc(s.image_prompt)}</div>

        <div class="flex items-center justify-between gap-2"><p class="text-xs font-semibold"><span class="text-emerald-300">② الفيديو</span> <span class="text-[color:var(--muted)]">Frames to Video · ${words(s.video_prompt)} كلمة</span></p>${copyBtn('v' + i)}</div>
        <div class="prompt mono">${esc(s.video_prompt)}</div>
      </div>
    </article>`).join('')}

    ${r.voiceover_ar ? `<div class="panel p-5 space-y-2">
      <div class="flex items-center justify-between"><p class="text-sm font-semibold">🎙️ التعليق الصوتي</p>${copyBtn('vo')}</div>
      <p class="text-[15px] leading-loose">${esc(r.voiceover_ar)}</p></div>` : ''}
    ${(r.onscreen_ar || []).length ? `<div class="panel p-5 space-y-2">
      <div class="flex items-center justify-between"><p class="text-sm font-semibold">✍️ نصوص الشاشة (في المونتاج)</p>${copyBtn('os')}</div>
      ${r.onscreen_ar.map((t) => `<p class="text-sm">• ${esc(t)}</p>`).join('')}</div>` : ''}
    ${(r.notes_ar || []).length ? `<div class="panel p-5 space-y-1.5"><p class="text-sm font-semibold">💡 ملاحظات</p>${r.notes_ar.map((t) => `<p class="text-xs text-[#cfd5df] leading-relaxed">• ${esc(t)}</p>`).join('')}</div>` : ''}

    <div id="revise-box" class="panel p-4 space-y-2.5">
      <p class="text-sm font-semibold">عدّل بكلامك</p>
      <textarea id="revise" rows="2" class="field leading-relaxed" placeholder="مثال: خلّ المشهد الثاني في مجلس، أو: أبيه أفخم وأسرع، أو: غيّر الفكرة كلها"></textarea>

      <button id="btn-revise" type="button" class="tap w-full rounded-xl bg-white text-black font-bold text-sm">طبّق التعديل</button>
    </div>`;
  icons();

/* ---------------- Copy / toast / history ---------------- */
let toastT;
function toast(title, desc, err) {
  $('toast-title').textContent = title; $('toast-desc').textContent = desc || '';
  $('toast-icon').textContent = err ? '⚠️' : '✓';
  $('toast').classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
  clearTimeout(toastT); toastT = setTimeout(() => $('toast').classList.add('opacity-0', 'pointer-events-none', 'translate-y-4'), 2600);
}
async function copyText(text, desc) {
  try { if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(text); else throw 0; }
  catch (e) { const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (x) {} ta.remove(); }
  toast('تم النسخ', desc || '');
}
function fullText(r) {
  const L = [`${(r.idea && r.idea.title_ar) || r.name}`, (r.idea && r.idea.logline_ar) || '', ''];
  r.scenes.forEach((s, i) => { L.push(`══ مشهد ${i + 1}: ${s.title_ar || ''} ══`, s.beat_ar || '', '', '① IMAGE (Nano Banana) — ' + (s.attach_ar || ''), s.image_prompt, '', '② VIDEO (Frames to Video)', s.video_prompt, ''); });
  if (r.voiceover_ar) L.push('══ التعليق الصوتي ══', r.voiceover_ar, '');
  if ((r.onscreen_ar || []).length) L.push('══ نصوص الشاشة ══', ...r.onscreen_ar.map((t) => '• ' + t));
  return L.join('\n');
}
function saveHistory() {
  const r = state.result; if (!r) return;
  const list = store.get('of7_history', []).filter((h) => h.time !== r.time);
  list.unshift({ ...r, thumb: state.img ? state.img.thumb : null });
  while (list.length > 30) list.pop();
  if (!store.set('of7_history', list)) store.set('of7_history', list.slice(0, 10).map((h) => ({ ...h, thumb: null })));
}
function renderHistory() {
  const list = store.get('of7_history', []);
  $('history-list').innerHTML = list.length ? list.map((h, i) => `<div class="flex items-center gap-3 p-2 rounded-xl hover:bg-white/[.03]">
      ${h.thumb ? `<img src="${h.thumb}" alt="" class="w-12 h-12 rounded-lg object-cover">` : '<span class="w-12 h-12 rounded-lg bg-[#151b27] flex items-center justify-center">🎬</span>'}
      <button type="button" data-hload="${i}" class="flex-1 min-w-0 text-right"><p class="text-sm font-semibold truncate">${esc((h.idea && h.idea.title_ar) || h.name)}</p><p class="text-xs text-[color:var(--muted)] truncate">${esc(h.name || '')} · ${new Date(h.time).toLocaleDateString('ar-SA-u-ca-gregory-nu-latn', { month: 'short', day: 'numeric' })}</p></button>
      <button type="button" data-hdel="${i}" aria-label="حذف" class="tap w-10 rounded-lg hover:bg-white/5 flex items-center justify-center text-rose-300"><i data-lucide="trash-2" class="w-4 h-4"></i></button></div>`).join('')
    : '<p class="text-sm text-center text-[color:var(--muted)] py-10">إعلاناتك تُحفظ هنا تلقائياً.</p>';
  icons();
}

/* ---------------- Image ---------------- */
function readImage(file) {
  return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = fr.result; }; fr.onerror = rej; fr.readAsDataURL(file); });
}
function resize(im, max, q) {
  const w = im.naturalWidth, h = im.naturalHeight, k = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', q);
}

/* ---------------- Events ---------------- */
function saveDraft() { const d = { mode: state.mode, name: $('name').value, idea: $('idea').value, opts: state.opts }; store.set('of7_draft', { ...d, img: state.img }) || store.set('of7_draft', d); }
document.addEventListener('DOMContentLoaded', () => {
  const d = store.get('of7_draft', null);
  if (d) { if (d.mode === 'free') state.mode = 'free'; $('name').value = d.name || ''; $('idea').value = d.idea || ''; if (d.img) state.img = d.img; if (d.opts) Object.keys(OPTS).forEach((k) => { if (d.opts[k] && OPTS[k].values[d.opts[k]]) state.opts[k] = d.opts[k]; }); }
  $('s-key').value = store.get('of_key', '');
  renderModels(); renderMode(); renderQuick(); renderResult(); icons();
  loadBrain();
  if (store.get('of_key', '')) refreshModels(true);

  document.body.addEventListener('click', async (ev) => {
    const t = ev.target.closest('button, [data-close]'); if (!t) return;
    const d = t.dataset;
    if (d.mode) { state.mode = d.mode; renderMode(); saveDraft(); }
    else if (d.act === 'upload') $('file').click();
    else if (d.act === 'remove-img') { state.img = null; renderDrop(); saveDraft(); }
    else if (d.open === 'settings') $('settings').classList.remove('hidden');
    else if (d.close) $(d.close).classList.add('hidden');
    else if (d.opt) { state.opts[d.opt] = d.val; renderQuick(); saveDraft(); }
    else if (d.copy) {
      const r = state.result; if (!r) return;
      const k = d.copy;
      if (k[0] === 'i') copyText(r.scenes[+k.slice(1)].image_prompt, `مشهد ${+k.slice(1) + 1}: الصقه مع صورة المنتج`);
      else if (k[0] === 'v') copyText(r.scenes[+k.slice(1)].video_prompt, `مشهد ${+k.slice(1) + 1}: Frames to Video`);
      else if (k === 'vo') copyText(r.voiceover_ar, 'التعليق الصوتي');
      else if (k === 'os') copyText(r.onscreen_ar.join('\n'), 'نصوص الشاشة');
    }
    else if (d.rev) { $('revise').value = d.rev; revise(d.rev); }
    else if (t.id === 'btn-revise') revise($('revise').value);
    else if (d.hload !== undefined) { const h = store.get('of7_history', [])[+d.hload]; if (h) { state.result = h; state.mode = h.mode === 'free' ? 'free' : 'product'; renderMode(); $('name').value = h.name || ''; $('idea').value = h.idea_in || ''; if (h.opts) state.opts = { ...state.opts, ...h.opts }; renderQuick(); renderResult(); setBusy(false); $('history').classList.add('hidden'); window.scrollTo({ top: $('result').offsetTop - 70, behavior: 'smooth' }); } }
    else if (d.hdel !== undefined) { const l = store.get('of7_history', []); l.splice(+d.hdel, 1); store.set('of7_history', l); renderHistory(); }
  });
  $('file').addEventListener('change', async (e) => {
    const f = e.target.files && e.target.files[0]; e.target.value = '';
    if (!f || !/^image\//.test(f.type)) return;
    try { const im = await readImage(f); state.img = { full: resize(im, 1024, 0.86), thumb: resize(im, 160, 0.7) }; renderDrop(); saveDraft(); }
    catch (err) { toast('تعذّرت قراءة الصورة', '', true); }
  });
  ['name', 'idea'].forEach((id) => $(id).addEventListener('input', saveDraft));
  $('btn-make').addEventListener('click', make);
  $('btn-copy-all').addEventListener('click', () => { if (state.result) { copyText(fullText(state.result), 'كل المشاهد والتعليق والنصوص'); $('copy-all-label').textContent = '✓ تم النسخ'; setTimeout(() => { $('copy-all-label').textContent = 'نسخ الإعلان كاملاً'; }, 1500); } });
  $('btn-revise-jump').addEventListener('click', () => { const b = $('revise-box'); if (b) { b.scrollIntoView({ behavior: 'smooth', block: 'center' }); setTimeout(() => $('revise').focus(), 400); } });
  $('btn-history').addEventListener('click', () => { renderHistory(); $('history').classList.remove('hidden'); });
  $('btn-settings').addEventListener('click', () => $('settings').classList.remove('hidden'));
  let keyT;
  $('s-key').addEventListener('input', () => { store.set('of_key', $('s-key').value.trim()); renderQuick(); clearTimeout(keyT); keyT = setTimeout(() => refreshModels(true), 800); });
  $('s-model').addEventListener('change', () => { store.set('of_model', $('s-model').value); renderModels(); });
  $('s-refresh').addEventListener('click', () => refreshModels(false));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') ['settings', 'history'].forEach((id) => $(id).classList.add('hidden')); });
});
